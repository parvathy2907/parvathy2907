name: Profile animations

on:
  schedule:
    - cron: "0 0 * * *"   # refresh once a day
  workflow_dispatch:       # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Neon contribution snake
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#161b22,#2e1065,#6d28d9,#a855f7,#00f5ff

      # Rotating 3D contribution chart
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect images
        run: cp profile-3d-contrib/*.svg dist/

      # Publish everything to the "output" branch (keeps your main branch clean)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
