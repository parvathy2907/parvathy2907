<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11192A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- soft glow behind laptop -->
  <ellipse cx="240" cy="190" rx="200" ry="120" fill="url(#halo)"/>

  <!-- floating particles -->
  <g fill="#A855F7">
    <circle cx="90" cy="250" r="2.5"><animate attributeName="cy" values="250;70" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="260" r="2"><animate attributeName="cy" values="260;60" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="240" r="1.8" fill="#00F5FF"><animate attributeName="cy" values="240;50" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="250" r="2.2" fill="#00F5FF"><animate attributeName="cy" values="250;80" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating code glyphs -->
  <g font-family="monospace" font-size="15" font-weight="bold" fill="#00F5FF" opacity="0">
    <text x="70" y="120">&lt;/&gt;<animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 10;0 -20" dur="5s" repeatCount="indefinite"/></text>
  </g>
  <g font-family="monospace" font-size="15" font-weight="bold" fill="#A855F7" opacity="0">
    <text x="385" y="110">{ }<animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 10;0 -20" dur="5s" begin="2.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- tail (behind laptop), swishing -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-10 318 190;12 318 190;-10 318 190" dur="3s" repeatCount="indefinite"/>
    <path d="M318 190 C 360 185, 385 160, 378 120 C 374 98, 392 88, 402 98" fill="none" stroke="#2A2F3D" stroke-width="16" stroke-linecap="round"/>
    <path d="M318 190 C 360 185, 385 160, 378 120 C 374 98, 392 88, 402 98" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- cat head (peeking over the screen) -->
  <g>
    <!-- ears -->
    <path d="M196 78 L188 30 L230 58 Z" fill="#2A2F3D" stroke="#3A4152" stroke-width="2" stroke-linejoin="round"/>
    <path d="M284 78 L292 30 L250 58 Z" fill="#2A2F3D" stroke="#3A4152" stroke-width="2" stroke-linejoin="round"/>
    <path d="M200 66 L195 42 L218 58 Z" fill="#A855F7" opacity="0.55"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 270 60;0 270 60;-8 270 60;0 270 60" keyTimes="0;0.85;0.9;1" dur="5s" repeatCount="indefinite"/>
      <path d="M280 66 L285 42 L262 58 Z" fill="#A855F7" opacity="0.55"/>
    </g>
    <!-- head -->
    <ellipse cx="240" cy="100" rx="58" ry="46" fill="#2A2F3D" stroke="#3A4152" stroke-width="2"/>
    <!-- eyes (blink) -->
    <g filter="url(#glow)">
      <ellipse cx="218" cy="92" rx="8" ry="10" fill="#00F5FF">
        <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="262" cy="92" rx="8" ry="10" fill="#00F5FF">
        <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- pupils follow the code -->
    <g fill="#0D1117">
      <ellipse cx="218" cy="94" rx="2.6" ry="7">
        <animate attributeName="ry" values="7;7;0.5;7;7" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="215;221;215" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="262" cy="94" rx="2.6" ry="7">
        <animate attributeName="ry" values="7;7;0.5;7;7" keyTimes="0;0.9;0.94;0.98;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="259;265;259" dur="2.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- nose + mouth -->
    <path d="M235 106 L245 106 L240 112 Z" fill="#F472B6"/>
    <path d="M232 115 Q236 120 240 114 Q244 120 248 115" fill="none" stroke="#8B93A7" stroke-width="1.8" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#8B93A7" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
      <line x1="200" y1="108" x2="170" y2="102"/>
      <line x1="200" y1="114" x2="168" y2="116"/>
      <line x1="280" y1="108" x2="310" y2="102"/>
      <line x1="280" y1="114" x2="312" y2="116"/>
    </g>
  </g>

  <!-- laptop screen -->
  <rect x="138" y="122" width="204" height="128" rx="10" fill="url(#screenGlow)" stroke="#00F5FF" stroke-opacity="0.55" stroke-width="2"/>
  <!-- window dots -->
  <circle cx="154" cy="136" r="3" fill="#FF5F57"/>
  <circle cx="165" cy="136" r="3" fill="#FEBC2E"/>
  <circle cx="176" cy="136" r="3" fill="#28C840"/>

  <!-- code lines typing in a loop -->
  <g stroke-linecap="round" stroke-width="5">
    <line x1="154" y1="154" x2="154" y2="154" stroke="#A855F7"><animate attributeName="x2" values="154;214;214;154" keyTimes="0;0.12;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="222" y1="154" x2="222" y2="154" stroke="#00F5FF"><animate attributeName="x2" values="222;222;272;272;222" keyTimes="0;0.12;0.22;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="166" y1="170" x2="166" y2="170" stroke="#C9D1D9" stroke-opacity="0.7"><animate attributeName="x2" values="166;166;250;250;166" keyTimes="0;0.22;0.36;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="166" y1="186" x2="166" y2="186" stroke="#00F5FF"><animate attributeName="x2" values="166;166;206;206;166" keyTimes="0;0.36;0.44;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="214" y1="186" x2="214" y2="186" stroke="#F472B6"><animate attributeName="x2" values="214;214;300;300;214" keyTimes="0;0.44;0.58;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="166" y1="202" x2="166" y2="202" stroke="#C9D1D9" stroke-opacity="0.7"><animate attributeName="x2" values="166;166;236;236;166" keyTimes="0;0.58;0.7;0.9;1" dur="8s" repeatCount="indefinite"/></line>
    <line x1="154" y1="218" x2="154" y2="218" stroke="#A855F7"><animate attributeName="x2" values="154;154;184;184;154" keyTimes="0;0.7;0.76;0.9;1" dur="8s" repeatCount="indefinite"/></line>
  </g>
  <!-- blinking cursor -->
  <rect x="190" y="212" width="7" height="12" fill="#00F5FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- paws over the top of the screen, tapping -->
  <g fill="#2A2F3D" stroke="#3A4152" stroke-width="2">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 0" keyTimes="0;0.15;0.3;1" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="210" cy="124" rx="15" ry="9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -4;0 0" keyTimes="0;0.45;0.6;0.75" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="270" cy="124" rx="15" ry="9"/>
    </g>
  </g>

  <!-- laptop base -->
  <path d="M118 250 L362 250 L378 266 Q380 270 374 270 L106 270 Q100 270 102 266 Z" fill="#1C2230" stroke="#3A4152" stroke-width="2" stroke-linejoin="round"/>
  <rect x="216" y="252" width="48" height="4" rx="2" fill="#3A4152"/>

  <!-- desk line -->
  <line x1="40" y1="276" x2="440" y2="276" stroke="#30363D" stroke-width="2" stroke-linecap="round"/>
</svg>
